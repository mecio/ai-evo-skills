version: "1.0"
id: claude
display-name: Claude Code
project-skill-path: .claude/skills

project-entrypoint:
  path: CLAUDE.md
  template: templates/adapters/claude/CLAUDE.tpl.md
  must-reference: .ai-evo-prj/entrypoint.md

invocation:
  example: "/<skill-name> key=value"
  command: [claude, -p, --permission-mode, dontAsk, --permission-prompts, none]
  prompt-delivery: stdin

profile-translation:
  application: instruction
  delegated-cli:
    reasoning-option: --effort
    disallowed-tools-option: --disallowedTools
    resource-tools:
      subagents:
        - Agent
      network:
        - WebSearch
        - WebFetch
        - Bash(.ai-evo/bin/ai-evo-github-read *)

execution-policy-translation:
  workspace-read-write:
    enforcement: native
    cli-arguments:
      - --permission-mode
      - dontAsk
      - --permission-prompts
      - none
      - --allowedTools
      - Read,Glob,Grep,Edit,Write,NotebookEdit,Bash
  workspace-read-only:
    enforcement: native
    cli-arguments:
      - --permission-mode
      - dontAsk
      - --permission-prompts
      - none
      - --tools
      - Read,Glob,Grep,Bash,WebSearch,WebFetch
      - --allowedTools
      - Read,Glob,Grep,WebSearch,WebFetch,Bash(.ai-evo/bin/ai-evo-git-read *)
      - --disallowedTools
      - Edit,Write,NotebookEdit
    instructions:
      - Use .ai-evo/bin/ai-evo-git-read for Git inspection; arbitrary shell commands are unavailable.
  network-disabled:
    enforcement: native
    cli-arguments:
      - --permission-mode
      - dontAsk
      - --permission-prompts
      - none
      - --tools
      - Read,Glob,Grep,Edit,Write,NotebookEdit,Bash
      - --allowedTools
      - Read,Glob,Grep,Edit,Write,NotebookEdit,Bash(.ai-evo/bin/ai-evo-git-read *)
      - --strict-mcp-config
      - --disallowedTools
      - WebSearch,WebFetch
    instructions:
      - Use .ai-evo/bin/ai-evo-git-read for Git inspection; arbitrary shell and network commands are unavailable.

capability-translation:
  git.remote-write:
    enforcement: native
    workspaces: [read-only, read-write]
    requires-network: true
    allow-tools:
      - "Bash(git push *)"
      - "Bash(git push)"
      - "Bash(gh stack submit *)"
      - "Bash(gh stack submit)"
      - "Bash(gh stack sync *)"
      - "Bash(gh stack sync)"
  github.remote-write:
    enforcement: native
    workspaces: [read-only, read-write]
    requires-network: true
    allow-tools:
      - "Bash(gh issue create *)"
      - "Bash(gh issue edit *)"
      - "Bash(gh issue close *)"
      - "Bash(gh issue reopen *)"
      - "Bash(gh issue delete *)"
      - "Bash(gh issue comment *)"
      - "Bash(gh pr create *)"
      - "Bash(gh pr edit *)"
      - "Bash(gh pr close *)"
      - "Bash(gh pr reopen *)"
      - "Bash(gh pr merge *)"
      - "Bash(gh pr ready *)"
      - "Bash(gh pr review *)"
      - "Bash(gh pr comment *)"
      - "Bash(gh release create *)"
      - "Bash(gh release edit *)"
      - "Bash(gh release delete *)"
      - "Bash(gh release upload *)"
      - "Bash(gh api * --method POST *)"
      - "Bash(gh api * --method PATCH *)"
      - "Bash(gh api * --method PUT *)"
      - "Bash(gh api * --method DELETE *)"
  github.auth-status:
    enforcement: native
    workspaces: [read-only, read-write]
    requires-network: true
    allow-tools: ["Bash(.ai-evo/bin/ai-evo-github-read auth-status)"]
    instructions:
      - Use .ai-evo/bin/ai-evo-github-read auth-status to check GitHub authentication.
  github.repo-view:
    enforcement: native
    workspaces: [read-only, read-write]
    requires-network: true
    allow-tools: ["Bash(.ai-evo/bin/ai-evo-github-read repo-view)"]
    instructions:
      - Use .ai-evo/bin/ai-evo-github-read repo-view to read the current GitHub repository.
  github.issue-view:
    enforcement: native
    workspaces: [read-only, read-write]
    requires-network: true
    allow-tools: ["Bash(.ai-evo/bin/ai-evo-github-read issue-view *)"]
    instructions:
      - Use .ai-evo/bin/ai-evo-github-read issue-view NUMBER to read an issue; the wrapper accepts only a positive integer.
