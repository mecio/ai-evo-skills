[project]
name = "ai-evo-skills"
version = "0.1.0b1"
description = "Compose, validate, plan and publish project-local AI skills"
readme = "README.md"
authors = [
    { name = "Graziano Ugenti" },
]
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
dependencies = [
    "jsonschema==4.23.0",
    "PyYAML==6.0.2",
]

[project.scripts]
ai-evo-skills = "ai_evo_skills.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tooling/src/ai_evo_skills"]
