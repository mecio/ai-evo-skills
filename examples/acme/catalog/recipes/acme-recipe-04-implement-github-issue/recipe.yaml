version: "1.0"
name: acme-recipe-04-implement-github-issue
input-resolver:
  uses: acme-cmd-report-github-issue-workflow
  with: { issue: "${{ inputs.issue }}", requested_recipe: "acme-recipe-04-implement-github-issue", developer_instructions: "${{ inputs.developer_instructions }}" }
inputs:
  issue: { required: true, description: "Numero o URL della issue esecutiva." }
  base_branch: { required: true, description: "Branch base o parent dello stack." }
  layer: { default: "", description: "JSON opzionale del layer stacked (id, sequence, title, body, dependencies)." }
  previous_review: { default: "", description: "Percorso opzionale della review verificata del layer precedente." }
  developer_instructions: { default: "", description: "Vincoli ulteriori." }
  worklog_session_name: { required: true, description: "Percorso canonico; per una sub-issue l'agente deriva il percorso sotto issue-<epic>/attempt-<nn>/subissues/." }
  worklog_session_input: { required: true, description: "JSON immutabile degli input funzionali; se omesso l'agente lo costruisce prima del piano." }
steps:
  - id: implement_issue
    uses: acme-cmd-implement-github-issue
    executor: claude
    with: { issue: "${{ inputs.issue }}", base_branch: "${{ inputs.base_branch }}", layer: "${{ inputs.layer }}", previous_review: "${{ inputs.previous_review }}", developer_instructions: "${{ inputs.developer_instructions }}" }
  - id: checkpoint_implementation
    uses: acme-cmd-save-worklog-output
    executor: current
    with: { session_name: "${{ inputs.worklog_session_name }}", recipe_name: acme-recipe-04-implement-github-issue, session_input: "${{ inputs.worklog_session_input }}", step_name: implement_issue, source_name: acme-cmd-implement-github-issue, outcome: succeeded, output: "${{ steps.implement_issue.output }}", expected_output_sha256: "${{ steps.implement_issue.output_sha256 }}", error: "null", complete: "false" }
  - id: publish_branch
    uses: acme-cmd-push-git-stacked-branch
    executor: current
    with: { implementation_report: "${{ steps.implement_issue.output }}" }
  - id: checkpoint_publication
    uses: acme-cmd-save-worklog-output
    executor: current
    with: { session_name: "${{ inputs.worklog_session_name }}", recipe_name: acme-recipe-04-implement-github-issue, session_input: "${{ inputs.worklog_session_input }}", step_name: publish_branch, source_name: acme-cmd-push-git-stacked-branch, outcome: succeeded, output: "${{ steps.publish_branch.output }}", expected_output_sha256: "${{ steps.publish_branch.output_sha256 }}", error: "null", complete: "false" }
  - id: save_result
    uses: acme-cmd-save-worklog-output
    executor: current
    with: { session_name: "${{ inputs.worklog_session_name }}", recipe_name: acme-recipe-04-implement-github-issue, session_input: "${{ inputs.worklog_session_input }}", step_name: implement_issue, source_name: acme-cmd-implement-github-issue, outcome: succeeded, output: "${{ steps.checkpoint_implementation.output }}", expected_output_sha256: "${{ steps.checkpoint_implementation.output_sha256 }}", error: "null", complete: "true" }
outputs:
  result: { value: "${{ steps.save_result.output }}" }
