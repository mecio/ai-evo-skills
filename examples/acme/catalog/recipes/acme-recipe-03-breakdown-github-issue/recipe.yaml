version: "1.0"
name: acme-recipe-03-breakdown-github-issue
input-resolver:
  uses: acme-cmd-report-github-issue-workflow
  with: { issue: "${{ inputs.issue }}", requested_recipe: "acme-recipe-03-breakdown-github-issue", new_workflow_attempt: "${{ inputs.new_workflow_attempt }}", reason: "${{ inputs.reason }}" }
inputs:
  issue: { required: true, description: "Numero o URL della issue principale." }
  issue_analysis: { required: true, description: "Analisi tecnica ready della issue principale." }
  new_workflow_attempt: { default: "", description: "Usare \"true\" per aprire un nuovo attempt di scomposizione." }
  reason: { default: "", description: "Motivo obbligatorio quando new_workflow_attempt è true." }
  worklog_session_name: { required: true, description: "Percorso canonico; se omesso l'agente deriva issue-<numero>/attempt-<nn>/03-breakdown-attempt-<nn>." }
  worklog_session_input: { required: true, description: "JSON immutabile degli input funzionali; se omesso l'agente lo costruisce prima del piano." }
steps:
  - id: breakdown_issue
    uses: acme-cmd-breakdown-github-issue
    executor: current
    with: { issue_analysis: "${{ inputs.issue_analysis }}" }
  - id: create_breakdown
    uses: acme-cmd-create-github-issue-breakdown
    executor: current
    with: { breakdown: "${{ steps.breakdown_issue.output }}" }
  - id: checkpoint_creation
    uses: acme-cmd-save-worklog-output
    executor: current
    with: { session_name: "${{ inputs.worklog_session_name }}", recipe_name: acme-recipe-03-breakdown-github-issue, session_input: "${{ inputs.worklog_session_input }}", step_name: create_breakdown, source_name: acme-cmd-create-github-issue-breakdown, outcome: succeeded, output: "${{ steps.create_breakdown.output }}", expected_output_sha256: "${{ steps.create_breakdown.output_sha256 }}", error: "null", complete: "false" }
  - id: record_breakdown
    uses: acme-cmd-record-github-issue-breakdown
    executor: current
    with: { session_name: "${{ inputs.worklog_session_name }}", breakdown: "${{ steps.checkpoint_creation.output }}" }
  - id: save_result
    uses: acme-cmd-save-worklog-output
    executor: current
    with: { session_name: "${{ inputs.worklog_session_name }}", recipe_name: acme-recipe-03-breakdown-github-issue, session_input: "${{ inputs.worklog_session_input }}", step_name: record_breakdown, source_name: acme-cmd-record-github-issue-breakdown, outcome: succeeded, output: "${{ steps.record_breakdown.output }}", expected_output_sha256: "${{ steps.record_breakdown.output_sha256 }}", error: "null", complete: "true" }
outputs:
  result: { value: "${{ steps.save_result.output }}" }
