version: "1.0"
name: acme-recipe-reviewed-change
inputs:
  target:
    description: Local Git commit or ref to compare with the tracked working tree, excluding submodules.
    default: HEAD
  focus:
    description: Review area to emphasize, such as correctness or security.
    default: correctness
steps:
  - id: review
    uses: acme-cmd-review
    with:
      target: "${{ inputs.target }}"
      focus: "${{ inputs.focus }}"
  - id: check_review
    uses: acme-step-check-review-output
    executor: current
    with:
      review: "${{ steps.review.output }}"
  - id: report
    uses: acme-cmd-report-review
    with:
      review: "${{ steps.check_review.output }}"
      target: "${{ inputs.target }}"
      focus: "${{ inputs.focus }}"
outputs:
  result:
    value: "${{ steps.report.output }}"
