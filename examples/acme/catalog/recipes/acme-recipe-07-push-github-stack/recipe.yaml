version: "1.0"
name: acme-recipe-07-push-github-stack
input-resolver:
  uses: acme-cmd-report-github-issue-workflow
  with: { issue: "${{ inputs.issue }}", requested_recipe: "acme-recipe-07-push-github-stack" }
inputs:
  issue: { required: true, description: "Numero o URL della issue principale o dell'epic proprietario dello stack." }
  verification_report: { required: true, description: "Report `verified` della recipe 05 oppure `accepted` della recipe 06." }
  publication_authorized: { required: true, description: "Deve essere letteralmente true; conferma la pubblicazione remota richiesta dallo sviluppatore." }
  worklog_session_name: { required: true, description: "Percorso canonico della sessione di pubblicazione." }
  worklog_session_input: { required: true, description: "JSON immutabile degli input funzionali della pubblicazione." }
steps:
  - id: push_stack
    uses: acme-cmd-push-git-stacked-stack
    executor: current
    with: { verification_report: "${{ inputs.verification_report }}", publication_authorized: "${{ inputs.publication_authorized }}" }
  - id: configure_upstreams
    uses: acme-cmd-configure-git-stack-upstreams
    executor: current
    with: { publication_report: "${{ steps.push_stack.output }}" }
  - id: save_result
    uses: acme-cmd-save-worklog-output
    executor: current
    with: { session_name: "${{ inputs.worklog_session_name }}", recipe_name: acme-recipe-07-push-github-stack, session_input: "${{ inputs.worklog_session_input }}", step_name: configure_upstreams, source_name: acme-cmd-configure-git-stack-upstreams, outcome: succeeded, output: "${{ steps.configure_upstreams.output }}", expected_output_sha256: "${{ steps.configure_upstreams.output_sha256 }}", error: "null", complete: "true" }
outputs:
  result: { value: "${{ steps.save_result.output }}" }
