version: "1.0"
name: acme-recipe-02-analyze-github-issue-code
input-resolver:
  uses: acme-cmd-report-github-issue-workflow
  with: { issue: "${{ inputs.issue }}", issue_number: "${{ inputs.issue_number }}", requested_recipe: "acme-recipe-02-analyze-github-issue-code", developer_instructions: "${{ inputs.developer_instructions }}" }
inputs:
  issue: { required: true, description: "Numero della issue GitHub da analizzare, oppure pending con issue_number valorizzato per collegare la recipe 00." }
  issue_number: { default: "", description: "Numero reale della issue: obbligatorio con issue=pending e sempre risolto dal workflow per l'analisi." }
  developer_instructions: { default: "", description: "Vincoli e chiarimenti iniziali dello sviluppatore." }
  worklog_session_name: { required: true, description: "Percorso canonico; se omesso l'agente deriva issue-<numero>/attempt-<nn>/02-analyze-attempt-<nn>." }
  worklog_session_input: { required: true, description: "JSON immutabile degli input funzionali; se omesso l'agente lo costruisce prima del piano." }
steps:
  - id: analyze_issue
    uses: acme-cmd-analyze-github-issue-code
    executor: current
    with: { issue: "${{ inputs.issue_number }}", developer_instructions: "${{ inputs.developer_instructions }}" }
  - id: record_analysis
    uses: acme-cmd-record-github-issue-analysis
    executor: current
    with: { session_name: "${{ inputs.worklog_session_name }}", analysis: "${{ steps.analyze_issue.output }}" }
  - id: save_result
    uses: acme-cmd-save-worklog-output
    executor: current
    with: { session_name: "${{ inputs.worklog_session_name }}", recipe_name: acme-recipe-02-analyze-github-issue-code, session_input: "${{ inputs.worklog_session_input }}", step_name: record_analysis, source_name: acme-cmd-record-github-issue-analysis, outcome: succeeded, output: "${{ steps.record_analysis.output }}", expected_output_sha256: "${{ steps.record_analysis.output_sha256 }}", error: "null", complete: "true" }
outputs:
  result: { value: "${{ steps.save_result.output }}" }
