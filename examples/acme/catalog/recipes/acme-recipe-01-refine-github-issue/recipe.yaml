version: "1.0"
name: acme-recipe-01-refine-github-issue
input-resolver:
  uses: acme-cmd-report-github-issue-workflow
  with: { issue: "${{ inputs.issue }}", requested_recipe: "acme-recipe-01-refine-github-issue", developer_instructions: "${{ inputs.developer_instructions }}" }
inputs:
  issue: { required: true, description: "Numero o URL della issue esistente." }
  developer_instructions: { default: "Rivedi con lo sviluppatore titolo e descrizione; dopo approvazione e autorizzazione esplicita aggiorna la issue.", description: "Istruzioni per la revisione e vincoli o chiarimenti iniziali dello sviluppatore." }
  worklog_session_name: { required: true, description: "Percorso canonico; se omesso l'agente deriva issue-<numero>/attempt-<nn>/01-refine-attempt-<nn>." }
  worklog_session_input: { required: true, description: "JSON immutabile degli input funzionali; se omesso l'agente lo costruisce prima del piano." }
steps:
  - id: refine_issue
    uses: acme-cmd-analyze-github-issue
    executor: current
    with: { issue: "${{ inputs.issue }}", developer_instructions: "${{ inputs.developer_instructions }}" }
  - id: save_result
    uses: acme-cmd-save-worklog-output
    executor: current
    with: { session_name: "${{ inputs.worklog_session_name }}", recipe_name: acme-recipe-01-refine-github-issue, session_input: "${{ inputs.worklog_session_input }}", step_name: refine_issue, source_name: acme-cmd-analyze-github-issue, outcome: succeeded, output: "${{ steps.refine_issue.output }}", expected_output_sha256: "${{ steps.refine_issue.output_sha256 }}", error: "null", complete: "true" }
outputs:
  result: { value: "${{ steps.save_result.output }}" }
